<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Swap Tool ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
  <div class="container">
    <header class="header">
      <h1>Face Swap Tool</h1>
      <p>Đổi khuôn mặt thông minh với công nghệ AI tiên tiến. Hỗ trợ ảnh và video!</p>
    </header>

    <div class="app-card">
      <div class="app-header">
        <h2>🚀 Công Cụ Đổi Khuôn Mặt</h2>
        <p>Zipped version optimized cho M1 chip</p>
      </div>

      <div class="app-content">
        <form id="swapForm" enctype="multipart/form-data">
          <div class="upload-section">
            <div class="upload-container" id="sourceContainer">
              <input type="file" name="source" id="sourceInput" class="file-input" required accept="image/*">
              <label for="sourceInput" class="upload-label">
                <div class="upload-icon">
                  <i class="fas fa-user-plus"></i>
                </div>
                <div class="upload-text">Ảnh Source</div>
                <div class="upload-hint">Chọn mặt muốn dán vào</div>
                <div class="upload-hint">Support: JPG, PNG, WebP</div>
              </label>
              <div class="file-preview" id="sourcePreview" style="display: none;"></div>
            </div>

            <div class="upload-container" id="targetsContainer">
              <input type="file" name="targets" id="targetsInput" class="file-input" required multiple accept="image/*,video/*" ondrop="dropHandler(event)" ondragover="dragOverHandler(event)" ondragleave="dragLeaveHandler(event)">
              <label for="targetsInput" class="upload-label">
                <div class="upload-icon">
                  <i class="fas fa-images"></i>
                </div>
                <div class="upload-text">Target Files</div>
                <div class="upload-hint">Chọn nhiều file để swap cùng lúc</div>
                <div class="upload-hint">Ảnh: JPG, PNG, WebP</div>
                <div class="upload-hint">Video: MP4, AVI, MOV</div>
                <div class="upload-hint">Kéo thả files vào đây!</div>
              </label>
              <div class="files-preview" id="targetsPreview" style="display: none;"></div>
            </div>
          </div>

          <div class="action-section">
            <button type="submit" class="swap-button" id="swapButton">
              <i class="fas fa-magic"></i>
              Swap Ngay!
            </button>
          </div>
        </form>

        <div id="result" class="result-section" style="display: none;"></div>

        <div id="progress" class="progress-container" style="display: none;">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-text" id="progressText">Đang xử lý...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
