<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Swap Tool ✨</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
  <div class="container">
    <header class="header">
      <h1>Face Swap Tool</h1>
      <p>Smart face swapping powered by advanced AI. Supports images and videos!</p>
    </header>

    <div class="app-card">
      <div class="app-header">
        <h2>🚀 Face Swap Tool</h2>
        <p>Optimized for Apple Silicon M1/M2 Chip</p>
      </div>

      <div class="app-content">
        <form id="swapForm" enctype="multipart/form-data">
          <div class="upload-section">
            <div class="upload-container" id="sourceContainer">
              <input type="file" name="source" id="sourceInput" class="file-input" required accept="image/*">
              <label for="sourceInput" class="upload-label">
                <div class="upload-icon">
                  <i class="fas fa-user-plus"></i>
                </div>
                <div class="upload-text">Source Image</div>
                <div class="upload-hint">Choose the face to paste</div>
                <div class="upload-hint">Support: JPG, PNG, WebP</div>
              </label>
              <div class="file-preview" id="sourcePreview" style="display: none;"></div>
            </div>

            <div class="upload-container" id="targetsContainer">
              <input type="file" name="targets" id="targetsInput" class="file-input" required multiple accept="image/*,video/*">
              <label for="targetsInput" class="upload-label">
                <div class="upload-icon">
                  <i class="fas fa-images"></i>
                </div>
                <div class="upload-text">Target Files</div>
                <div class="upload-hint">Select multiple files to swap at once</div>
                <div class="upload-hint">Images: JPG, PNG, WebP</div>
                <div class="upload-hint">Videos: MP4, AVI, MOV</div>
                <div class="upload-hint">Drag & drop files here!</div>
              </label>
              <div class="files-preview" id="targetsPreview" style="display: none;"></div>
            </div>
          </div>

          <div class="action-section">
            <button type="submit" class="swap-button" id="swapButton">
              <i class="fas fa-magic"></i>
              Swap Now!
            </button>
          </div>
        </form>

        <div id="result" class="result-section" style="display: none;"></div>

        <div id="progress" class="progress-container" style="display: none;">
          <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="progress-details">
            <div class="progress-text" id="progressText">Processing...</div>
            <div class="current-file" id="currentFile" style="font-size: 0.9rem; color: #666; margin-top: 0.25rem;"></div>
            <div class="processing-speed" id="processingSpeed" style="font-size: 0.8rem; color: #888; margin-top: 0.25rem;"></div>
          </div>
          <div class="queue-info" id="queueInfo" style="margin-top: 1rem; padding: 0.75rem; background: #f8f9fa; border-radius: 0.5rem; display: none;">
            <div style="font-size: 0.9rem; font-weight: 500; margin-bottom: 0.5rem;">Queue Status:</div>
            <div id="queueDetails"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
